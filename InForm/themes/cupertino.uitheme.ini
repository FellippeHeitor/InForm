RadioButton=cupertino/radiobutton.png
ScrollButtons=cupertino/scrollbuttons.png
ScrollHButtons=cupertino/scrollhbuttons.png
ScrollHThumb=cupertino/scrollhthumb.png
ScrollHTrack=cupertino/scrollhtrack.png
ScrollThumb=cupertino/scrollthumb.png
ScrollTrack=cupertino/scrolltrack.png
