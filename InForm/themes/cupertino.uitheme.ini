; InForm-PE theme file: Cupertino, a light theme inspired by the macOS look
; Load it at run time with: SetTheme "InForm/themes/cupertino.uitheme.ini"
; This is a bitmap theme: controls are drawn from the images in the cupertino folder.
; Each image must keep the size and layout of the built-in XP image it replaces;
; any image left out falls back to the built-in one (NotFound is not replaced here).
; The images are original artwork made for InForm-PE (no Apple assets are used).

[Theme]
Name=Cupertino
Base=xp
Style=bitmap

[Colors]
WindowBack=ECECEC
WindowText=262626
InputBack=FFFFFF
InputText=262626
ButtonFace=FFFFFF
ButtonText=262626
SelectedBack=0064E1
SelectedText=FFFFFF
Border=BFBFBF
Accent=007AFF
AccentText=FFFFFF
FocusRing=7FB2F0
Caret=262626
DisabledText=A8A8A8
TipBack=F2F2F2
TipText=262626
MenuBack=F6F6F6
TrackBack=E3E3E3

[Images]
Arrows=cupertino/arrows.png
Button=cupertino/button.png
CheckBox=cupertino/checkbox.png
Frame=cupertino/frame.png
MenuCheckmark=cupertino/menucheckmark.png
